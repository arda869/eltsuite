<!doctype html>
<html lang="en">
  <head>
    <script>try{var t=localStorage.getItem('ll.theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}try{var b=localStorage.getItem('ll.brand');if(/^#[0-9a-f]{6}$/i.test(b||''))document.documentElement.style.setProperty('--brand',b)}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>ELT Suite</title>
    <meta name="description" content="Everything an English teacher needs, in one place: plan the lesson, teach it live and follow every learner’s progress. Coming soon; teachers join by invitation." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f8f8f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1d1b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ELT Suite" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="sbs" />
    <script>
      /* Opened from the home screen: behave like an app. The top of the screen (time, battery)
         blends with the app: white over the light top bar, see-through over the dark theme. */
      try {
        var sa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (sa) {
          var h = document.documentElement;
          h.dataset.standalone = '';
          if (h.dataset.theme === 'dark') document.getElementById('sbs').setAttribute('content', 'black-translucent');
          document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
        }
      } catch (e) {}
      /* No zooming the page, on any screen, like an app (text size is in the Aa menu): no pinch on
         phones, tablets and trackpads, no Ctrl/Cmd with the wheel or + and -. Drawing boards and
         other parts that zoom themselves still get these events; only the browser's zoom stops. */
      try {
        var stop = function (e) { e.preventDefault(); };
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('touchmove', function (e) { if ((e.scale !== undefined && e.scale !== 1) || e.touches.length > 1) e.preventDefault(); }, { passive: false });
        document.addEventListener('wheel', function (e) { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
        document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].indexOf(e.key) >= 0) e.preventDefault(); });
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400,50;0,9..144,500,50;0,9..144,600,50;1,9..144,400,50&family=Karla:wght@400;500;600&family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#d98f63" style="fill:var(--brand,#d98f63)"/><rect x="14" y="12" width="5.5" height="24" rx="2.75" fill="#fff"/><rect x="14" y="12" width="21" height="5.5" rx="2.75" fill="#fff"/><rect x="14" y="21.25" width="15" height="5.5" rx="2.75" fill="#fff"/><rect x="14" y="30.5" width="21" height="5.5" rx="2.75" fill="#fff"/></svg></div></div>
    <style>.boot{position:fixed;inset:0;display:grid;place-items:center;background:#f8f8f9}[data-theme=dark] .boot{background:#1f1d1b}.boot svg{animation:boot 1.2s ease-in-out infinite}@keyframes boot{50%{opacity:.55;transform:scale(.94)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
