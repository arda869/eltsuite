  <head>
    <script>try{var t=localStorage.getItem('ll.theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lesson Lit</title>
    <meta name="description" content="A calm, live online classroom for English teachers." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1d1b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lesson Lit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="sbs" />
    <script>
      /* Opened from the home screen: behave like an app. The top of the screen (time, battery)
         blends with the app: white over the light top bar, see-through over the dark theme. */
      try {
        var sa = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (sa) {
          var h = document.documentElement;
          h.dataset.standalone = '';
          if (h.dataset.theme === 'dark') document.getElementById('sbs').setAttribute('content', 'black-translucent');
          /* No pinch or double-tap zoom, like an app (text size is in the Aa menu). */
          document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
          document.addEventListener('touchmove', function (e) { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });
          document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
        }
      } catch (e) {}
    </script>
