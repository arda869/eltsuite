name: Real song separation proof
on:
  push:
    branches: [codex/song-stems]
  workflow_dispatch:
jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm --prefix functions ci --no-audit --no-fund
      - run: node --test test/ai/*.test.mjs test/speech/*.test.mjs
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --config firebase.ai-usage.json --project demo-song-stems "node test/speech/song-jobs.mjs && node test/speech/song-stems-jobs.mjs"
      - run: npm run build
        env:
          VITE_ELT_AI_PILOT: 'true'
      - run: npx playwright install --with-deps chromium
      - run: |
          node test/smoke.mjs --only=Songs: --a11y
      - run: npm run a11y
      - run: node --test test/speech/song-separation.test.mjs
      - name: Real model on the model publisher's public audio example
        run: |
          curl -fL --retry 2 https://raw.githubusercontent.com/deezer/spleeter/master/audio_example.mp3 -o /tmp/example.mp3
          functions/node_modules/ffmpeg-static/ffmpeg -nostdin -v error -stream_loop -1 -i /tmp/example.mp3 -t 180 /tmp/proof.mp3
          node test/speech/song-separation-real.mjs /tmp/proof.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: separated-public-example
          path: outputs/stems/
