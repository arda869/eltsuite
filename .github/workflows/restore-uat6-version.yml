name: Restore UAT 6 test version setting
on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect first, then restore the one hidden UAT task
        required: true
        type: choice
        options: [inspect, restore]
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm --prefix functions ci --no-audit --no-fund
      - name: Configure credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA"
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Check or restore only the hidden UAT version setting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/restore-uat6-version.mjs '${{ inputs.action }}'
      - name: Remove local credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
