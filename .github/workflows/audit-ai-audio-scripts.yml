name: Audit AI audio script migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply after reviewing a prior dry-run count (default: read only)'
        type: boolean
        default: false
      expected_legacy_count:
        description: 'Exact legacyScripts count from the reviewed dry run; required for apply'
        type: string
        required: false
      live_pin_uat:
        description: 'Temporarily show the hidden synthetic AI lesson and test a normal learner PIN session (default: off)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts
      - name: Prepare existing Firebase credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SERVICE_ACCOUNT"
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
      - name: Count legacy public AI transcripts (read only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node scripts/migrate-ai-audio-scripts.mjs
      - name: Inspect B-019 media job (read only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node scripts/diagnose-b019-media.mjs
      - name: Install browser for independent learner check
        if: inputs.live_pin_uat == true
        run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Verify normal learner PIN and private AI script access
        if: inputs.live_pin_uat == true
        timeout-minutes: 10
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          B029_SCREENSHOT: ${{ runner.temp }}/b029-learner.png
        run: node scripts/uat-b029-independent-learner.mjs
      - name: Restore hidden AI UAT lesson
        if: always() && inputs.live_pin_uat == true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: node scripts/restore-b029-hidden.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.live_pin_uat == true
        with:
          name: b029-independent-learner-${{ github.run_id }}
          path: ${{ runner.temp }}/b029-*.png
          if-no-files-found: ignore
      - name: Copy, verify, then remove legacy public script fields
        if: inputs.apply == true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          EXPECTED_COUNT: ${{ inputs.expected_legacy_count }}
        run: node scripts/migrate-ai-audio-scripts.mjs --apply "--expected-legacy-count=$EXPECTED_COUNT"
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
