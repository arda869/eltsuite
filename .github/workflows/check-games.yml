name: Classroom games
on:
  pull_request:
    paths:
      - 'src/games/**'
      - 'src/offline/**'
      - 'scripts/build-offline.mjs'
      - 'functions/games/**'
      - 'test/games*'
      - 'firestore.rules'
      - 'test/ai/games.test.mjs'
      - '.github/workflows/check-games.yml'
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - run: node --test test/ai/games.test.mjs
      - run: node scripts/build-offline.mjs
      - run: node test/games-offline.mjs
      - run: node test/games-offline-resources.mjs
      - run: node test/games.mjs
      - run: node test/games-editor.mjs
      - run: node test/games-show.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@4
      - run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-ai-access 'node test/games-access.mjs && node test/games-modes-service.mjs' 
