name: Classroom games
on:
  pull_request:
    paths:
      - 'src/games/**'
      - 'functions/games/**'
      - 'test/games.mjs'
      - 'test/ai/games.test.mjs'
      - '.github/workflows/check-games.yml'
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - run: node --test test/ai/games.test.mjs
      - run: node test/games.mjs
