name: Check private video connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-video-connection.yml', 'functions/video/check-connection.mjs', 'test/video-connection.test.mjs']
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify diagnostic privacy
        run: node --test test/video-connection.test.mjs
      - name: Install server dependencies
        run: npm --prefix functions ci --no-audit --no-fund
      - name: Prepare private cloud credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA"
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Check connection without generating video
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node functions/video/check-connection.mjs
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
