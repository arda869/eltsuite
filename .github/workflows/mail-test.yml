name: Test email

on:
  workflow_dispatch:
    inputs:
      to:
        description: Who gets the test email
        default: arda@eltsuite.com
  push:
    branches: [main]
    paths: [scripts/mail-test.mjs, scripts/email-layout.mjs, scripts/email-sample.mjs, .github/workflows/mail-test.yml]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Send a test email
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TO: ${{ inputs.to || 'arda@eltsuite.com' }}
        run: |
          # Wait for the email pictures to be live on eltsuite.com (the site deploys at the same time).
          for i in $(seq 1 60); do curl -sI https://eltsuite.com/email/logo.png | grep -qi "content-type: image/png" && break; sleep 10; done
          mkdir -p "$RUNNER_TEMP/m" && cp scripts/mail-test.mjs scripts/email-layout.mjs scripts/email-sample.mjs "$RUNNER_TEMP/m/" && cd "$RUNNER_TEMP/m"
          node mail-test.mjs
