name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
      - name: Install backend test dependencies
        run: npm --prefix functions ci --no-audit --no-fund
      - name: Coaching and lesson AI checks
        run: node --test test/ai/*.test.mjs test/coach/*.test.mjs
      - name: Recording and speaking checks
        run: node --test test/speech/*.test.mjs
      - name: Push registration and delivery regression checks
        run: node test/push-notifications.mjs

      - name: Feature discovery checks
        run: node --test test/discovery/*.test.mjs

      - name: Feature discovery privacy rules
        run: |
          # Match PR checks: respect the app lockfile and keep the Firebase CLI in npx's tool cache.
          npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@4.0.1
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-feature-discovery "node test/discovery/access.mjs && ONBOARDING_TEST_PROJECT=demo-feature-discovery node test/onboarding-access.mjs && SONG_TEST_PROJECT=demo-feature-discovery node test/speech/song-jobs.mjs"
      - name: Per-user AI allowance transactions and security
        run: npx --yes firebase-tools@14 emulators:exec --only firestore,auth --config firebase.ai-usage.json --project demo-ai-allowances "node test/ai/feature-usage-integration.mjs"
      - name: Help assistant checks
        run: node --test test/ai/help.test.mjs

      - name: Video editor and storyboard checks
        run: node --test test/video-model.test.mjs test/video-provider.test.mjs test/video-inline.test.mjs test/video-secret-binding.test.mjs test/video-connection.test.mjs
      - name: Video access rules and service checks
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-video-editor "node test/video-access.mjs"
      - name: Independent teacher-trainer permission rules
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-trainer-access "node test/trainer-access.mjs"
      - name: File retention regression checks
        run: node --test test/file-bin-cleanup.mjs
      - name: Build
        env:
          VITE_ELT_AI_PILOT: 'true'
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            msg=$(grep -iE "error" "$RUNNER_TEMP/build.log" | head -5 | tr '\n' ' ')
            echo "::error::Build failed: ${msg:-see log}"
            exit 1
          fi

      - name: Verify app route and asset cache headers
        run: npx --yes firebase-tools@14 emulators:exec --only hosting --project demo-hosting-cache "node test/hosting-cache.mjs"

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Trainer grant and course creation journey (Firebase simulated)
        run: node test/admin-trainer-ui.mjs

      - name: Smoke and accessibility tests
        timeout-minutes: 20
        run: |
          set +e
          npm run a11y > "$RUNNER_TEMP/smoke.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/smoke.log"
          { echo '### Smoke tests'; echo '```'; tail -60 "$RUNNER_TEMP/smoke.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then
            { grep -aE "^✗|^   |serious|did not start" "$RUNNER_TEMP/smoke.log" | head -12; tail -8 "$RUNNER_TEMP/smoke.log"; } | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Check deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is missing or empty."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy database rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install --no-save --no-audit --no-fund google-auth-library@9
          node scripts/deploy-rules.mjs

      - name: Deploy Designer image service
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("functions/.env.lesson-lit", "ELT_AI_MODEL=gpt-6.1-sol\nELT_AI_ENABLED=true\n");'
          npx --yes firebase-tools@14 deploy --only functions:designerImage --project lesson-lit --non-interactive
          node scripts/check-designer-binding.mjs

      - name: Deploy opt-in lesson assistant
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm --prefix functions install --no-audit --no-fund
          node functions/ai/preflight.mjs
          node functions/ai/cleanup.mjs
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("functions/.env.lesson-lit", "ELT_AI_MODEL=gpt-6.1-sol\nELT_AI_ENABLED=true\n");'
          node functions/video/preflight.mjs
          # Source discovery must see the same connection flag as the deployed runtime.
          set -a
          . functions/.env.lesson-lit
          set +a
          set -o pipefail
          npx --yes firebase-tools@14 deploy --only functions:designerImage,functions:adminAiUsage,functions:videoStudio,functions:refreshVideoJobs,functions:prepareLessonMedia,functions:lessonAssistant,functions:helpAssistant,functions:teachingDefinition,functions:recordingSpeech,functions:recordingTranscript,functions:recordingDialogue,functions:recordingLyrics,functions:recordingSong,functions:recordingSongResult,functions:recordingSongLesson,functions:speakingTask,functions:closeSpeakingAtDeadline --project lesson-lit --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/assistant-deploy.log"
          grep -q 'Deploy complete!' "$RUNNER_TEMP/assistant-deploy.log" || { echo '::error::Firebase did not confirm the assistant deployment completed.'; exit 1; }

      - name: Verify deployed video secret binding and API authentication
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node functions/video/check-connection.mjs

      - name: Check assistant rejects signed-out requests
        run: |
          node --input-type=module - <<'JS'
          const r = await fetch('https://us-central1-lesson-lit.cloudfunctions.net/lessonAssistant', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: { action: 'list', classId: 'deploy-check' } })
          });
          const body = await r.json();
          if (r.status !== 401 || body.error?.status !== 'UNAUTHENTICATED') throw Error('The assistant did not reject a signed-out request as expected.');
          console.log('Assistant deployed and rejects signed-out requests. No model call was made.');
          JS

      - name: Deploy site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@14 deploy --only hosting --project lesson-lit --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            msg=$(grep -iE "error|denied|permission|not found|enable" "$RUNNER_TEMP/deploy.log" | tail -6 | tr '\n' ' ')
            echo "::error::Site deploy failed: ${msg:-see log}"
            exit 1
          fi

      - name: Deploy server functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm --prefix functions install --no-audit --no-fund
          set -a
          . functions/.env.lesson-lit
          set +a
          set -o pipefail
          if ! npx --yes firebase-tools@14 deploy --only functions --project lesson-lit --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/fn.log"; then
            msg=$(grep -iE "error|denied|permission|billing|blaze|enable" "$RUNNER_TEMP/fn.log" | tail -6 | tr '\n' ' ')
            echo "::error::Server functions were not deployed: ${msg:-see log}"
            exit 1
          fi

          grep -q 'Deploy complete!' "$RUNNER_TEMP/fn.log" || { echo '::error::Firebase did not confirm the server function deployment completed.'; exit 1; }

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
