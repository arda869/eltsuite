name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            msg=$(grep -iE "error" "$RUNNER_TEMP/build.log" | head -5 | tr '\n' ' ')
            echo "::error::Build failed: ${msg:-see log}"
            exit 1
          fi

      - name: Check deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is missing or empty."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          if ! npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project lesson-lit --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            msg=$(grep -iE "error|denied|permission|not found|enable" "$RUNNER_TEMP/deploy.log" | tail -6 | tr '\n' ' ')
            echo "::error::Deploy failed: ${msg:-see log}"
            exit 1
          fi

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
