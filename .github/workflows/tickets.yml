name: Support tickets

# Copies the support tickets not done yet (with their screenshots) to the support-tickets branch,
# where they are read and worked on. Run by hand with a ticket id to answer it first.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      ticket:
        description: 'Ticket id to answer (leave empty to only copy the tickets)'
        required: false
        default: ''
      status:
        description: 'Move it to'
        type: choice
        options: ['', 'open', 'doing', 'done']
        default: ''
      note:
        description: 'Answer, shown under the ticket in ELT Suite'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: support-tickets
  cancel-in-progress: false

jobs:
  tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Answer and copy the tickets
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TICKET: ${{ inputs.ticket }}
          STATUS: ${{ inputs.status }}
          NOTE: ${{ inputs.note }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          mkdir -p "$RUNNER_TEMP/t" && cp scripts/tickets.mjs "$RUNNER_TEMP/t/"
          cd "$RUNNER_TEMP/t" && npm init -y >/dev/null && npm install --no-audit --no-fund firebase-admin@12 >/dev/null
          if [ -n "$TICKET" ]; then node tickets.mjs answer "$TICKET" "$STATUS" "$NOTE"; fi
          node tickets.mjs export "$RUNNER_TEMP/out"
          rm -f "$RUNNER_TEMP/sa.json"
      # One commit on its own branch, replaced each time, so old screenshots do not pile up.
      - name: Publish to the support-tickets branch
        run: |
          git config user.name 'ELT Suite tickets'
          git config user.email 'tickets@users.noreply.github.com'
          git fetch --depth=1 origin support-tickets || true
          git checkout --orphan tickets-new
          git rm -rfq . && git clean -fdxq
          cp -r "$RUNNER_TEMP/out/." .
          git add -A
          git commit -qm "Support tickets, $(date -u '+%Y-%m-%d %H:%M') UTC"
          if git rev-parse -q --verify origin/support-tickets >/dev/null && [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse origin/support-tickets^{tree})" ]; then
            echo "No change since the last copy."
          else
            git push -f origin HEAD:support-tickets
          fi
