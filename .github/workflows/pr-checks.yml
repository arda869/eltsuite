name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, smoke and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Invitation template checks
        run: node test/invitation-emails.mjs
      - name: Push registration and delivery regression checks
        run: node test/push-notifications.mjs
      - name: Lesson assistant contract and provider checks
        run: node --test test/ai/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify AI access security rules
        run: |
          npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@4.0.1
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-ai-access 'node test/ai/firestore-access.mjs'
      - name: Build and type check
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke and accessibility checks
        run: npm run a11y
