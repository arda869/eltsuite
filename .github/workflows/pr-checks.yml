name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, smoke and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Recording and speaking checks
        run: |
          npm --prefix functions ci --no-audit --no-fund
          node --test test/speech/*.test.mjs
      - name: Invitation template checks
        run: node test/invitation-emails.mjs
      - name: Push registration and delivery regression checks
        run: node test/push-notifications.mjs
      - name: Lesson assistant contract and provider checks
        run: node --test test/ai/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Account deletion permission and cleanup checks
        run: |
          node --test functions/accounts/security.test.mjs
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-account-deletion "node functions/accounts/integration.mjs"
      - name: Verify AI access security rules
        run: |
          npm install --prefix functions --no-package-lock --no-audit --no-fund
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-ai-access 'node test/ai/firestore-access.mjs && node test/file-access.mjs && node test/onboarding-access.mjs && node test/learner-answer-access.mjs && INVITATION_TEST_PROJECT=demo-ai-access node test/invitation-requests-access.mjs && node test/ai/create-integration.mjs && node test/ai/task-tools-integration.mjs && node test/ai/learning-integration.mjs && node test/ai/learning-access.mjs && node test/designer/integration.mjs && node test/speech/firestore-access.mjs && node test/speech/song-jobs.mjs'
      - name: Material import saves reviewed tasks hidden
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --config firebase.ai-usage.json --project demo-material-import 'node test/ai/materials-integration.mjs'
      - name: Assessment, roster, invitation and call security boundaries
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-phase2-security 'node test/security-phase2-firestore.mjs'
      - name: Learner discussion timeline and access
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-learning-timeline 'node functions/test/learner-discussion-timeline.mjs'
      - name: Live classroom security boundaries
        run: |
          node test/collab-access.mjs
          npx --yes firebase-tools@14 emulators:exec --only database --project demo-phase2-security 'node test/security-phase2-rtdb.mjs'
      - name: Per-user AI allowances and admin security
        run: npx --yes firebase-tools@14 emulators:exec --only firestore,auth --config firebase.ai-usage.json --project demo-ai-allowances "node test/ai/feature-usage-integration.mjs"
      - name: Private coaching history and durable replies
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-coach-history "node test/coach-history-access.mjs && node test/coach-history-service.mjs"
      - name: Applied Linguistics contracts and corpus adapter
        run: node --test functions/linguistics/*.test.mjs
      - name: Applied Linguistics privacy and reuse journeys
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-linguistics "node functions/linguistics/integration.mjs"
      - name: Observation contracts and private inquiry journey
        run: |
          node --test functions/observations/*.test.mjs
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-observation "node functions/observations/integration.mjs"
      - name: Video editor and storyboard checks
        run: node --test test/video-model.test.mjs test/video-provider.test.mjs test/video-inline.test.mjs
      - name: Video access rules and service checks
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-video-editor "node test/video-access.mjs"
      - name: Google and password sign-in retain the same identity
        run: npx --yes firebase-tools@14 emulators:exec --config test/firebase-auth.json --only auth --project demo-ai-access "node test/password-link-integration.mjs"
      - name: File retention regression checks
        run: node --test test/file-bin-cleanup.mjs
      - name: Build and type check
        run: npm run build
      - name: Build The Information Gap
        run: npm run build:information-gap
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: The Information Gap publication and access journeys (Firebase simulated)
        run: npx --yes firebase-tools@14 emulators:exec --only firestore,auth --config firebase.information-gap.emulators.json --project demo-information-gap "node test/information-gap-rules.mjs && node scripts/test-information-gap.mjs"
      - name: Lesson and Collab PDF exports (Firebase simulated)
        run: node test/inline-pdf-audit.mjs
      - name: Saved coaching history and pinned panel (AI and Firebase simulated)
        run: node test/coach-history-ui.mjs

      - name: Spelling and scoped teaching controls
        run: node --test test/spelling.test.mjs test/coach/*.test.mjs
      - name: Task insertion and spelling journey (Firebase simulated)
        run: node test/tuesday-teaching-ui.mjs
      - name: Gallery, table controls and print layout (Firebase simulated)
        run: node test/friday-wishes-ui.mjs
      - name: Downloaded offline lesson and karaoke
        run: node test/offline-lesson-ui.mjs
      - name: Audio script visibility journey (Firebase simulated)
        run: node test/audio-script-ui.mjs

      - name: Applied Linguistics teacher journey (Firebase simulated)
        timeout-minutes: 8
        run: node test/linguistics-ui.mjs

      - name: Smoke and accessibility checks
        run: npm run a11y
