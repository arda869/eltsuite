name: Preview

# Screenshots of the app with stand-ins for Firebase, for checking changes by eye. Runs on preview/*
# branches only and never deploys. The pictures go to the preview-shots branch.
on:
  push:
    branches: ['preview/**']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Take the screenshots
        run: node test/preview.mjs
      - name: Keep them on the preview-shots branch
        run: |
          cd preview-out
          git init -q -b preview-shots
          git config user.name "preview"
          git config user.email "preview@users.noreply.github.com"
          echo "${GITHUB_SHA}" > sha.txt
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" preview-shots
