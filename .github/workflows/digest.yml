name: Notifications and email summaries

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Send notifications and email summaries
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          mkdir -p "$RUNNER_TEMP/d" && cp scripts/digest.mjs scripts/push.mjs "$RUNNER_TEMP/d/" && cd "$RUNNER_TEMP/d"
          npm init -y >/dev/null && npm install --no-audit --no-fund firebase-admin@12 nodemailer@6 >/dev/null
          node push.mjs || echo "Notifications could not be sent this time."
          if [ -n "$SMTP_URL" ]; then node digest.mjs; else echo "No SMTP_URL secret yet: no email summaries."; fi
          rm -f "$RUNNER_TEMP/sa.json"
